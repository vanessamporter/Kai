name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install LDAP build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gcc libldap2-dev libsasl2-dev

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint code for consistent style
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Scan for common security issues using static analysis
        run: uvx bandit -r kai config -x kai/migrations

      - name: Scan for known vulnerabilities in dependencies
        run: |
          uv export --frozen --no-dev --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: kai
          POSTGRES_DB: kai_django_dev
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install native dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y gcc libldap2-dev libsasl2-dev tshark

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          DATABASE_URL: postgres://kai:kai@localhost:5432/kai_django_dev
        run: uv run pytest
