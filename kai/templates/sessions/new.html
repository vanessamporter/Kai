{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="text-center mb-8">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 80" class="kai-auth-logo mx-auto" aria-label="Kai">
      <defs>
        <linearGradient id="authMountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:var(--m-trojan-blue)" />
          <stop offset="100%" style="stop-color:var(--m-dsu-blue)" />
        </linearGradient>
      </defs>
      <path d="M7 59 31 19l13 22 9-15 17 33Z" fill="url(#authMountainGrad)" />
      <path d="m31 19-9 15 9-6 6 7 3-2Z" fill="white" opacity="0.95" />
      <path d="m53 26-7 12 7-5 5 6 3-2Z" fill="white" opacity="0.9" />
      <path d="M7 59h63" stroke="var(--m-dsu-gray-light)" stroke-width="3" stroke-linecap="round" />
      <text x="82" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="-0.5" class="kai-auth-logo-text">kai</text>
    </svg>
    <p class="text-gray-500 text-sm mt-2" style="font-family: var(--kai-display); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.65rem;">Packet Capture Library</p>
  </div>

  <div class="kai-auth-card">
    <h1 class="text-lg font-bold mb-6">Log in</h1>

    <form class="space-y-4" method="post" action="/login">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-300" for="email">Email</label>
        <input autofocus required class="mt-1 block w-full rounded border-gray-600 shadow-sm sm:text-sm" type="email" name="email" id="email">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300" for="password">Password</label>
        <input required class="mt-1 block w-full rounded border-gray-600 shadow-sm sm:text-sm" type="password" name="password" id="password">
      </div>

      <div>
        <input type="submit" value="Log in" class="kai-btn kai-btn-primary w-full justify-center">
      </div>
    </form>
  </div>

  <div class="mt-5 text-center text-sm space-y-1">
    {% if allow_public_signup %}<p><a href="/signup" class="text-amber-400 hover:underline">Create an account</a></p>{% endif %}
    <p><a href="/password_reset" class="text-gray-500 hover:text-gray-400">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
